<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Spot</title>
    <style>
    
  box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

body {
background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
color: #f8fafc;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 24px;
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.08);
 border-radius: 24px;
padding: 40px;
width: 100%;
 max-width: 540px; 
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        

        /* Header feels more like an invitation */
        .brand-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #f1f5f9, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Form Layout specifics */
        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Fields that actually feel satisfying to click into */
        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        /* Specific tweak to make dark mode dropdowns look human */
        select option {
            background: #1e293b;
            color: #ffffff;
        }

        textarea {
            resize: none;
            min-height: 90px;
        }

        /* Button with dynamic feedback */
        .action-btn {
     width: 100%;
            padding: 16px;
            background: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-top: 10px;
        }

        .action-btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

    
    </style>
</head>
<body>

    <div class="booking-card">
        <div class="brand-header">
            <h1>Reserve Your Experience</h1>
            <p>Drop your details below, and we'll save you a spot.</p>
        </div>

        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Reservation requested! (This is just a frontend demo).');">
            
            <!-- Full Name -->
            <div class="input-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Alex Mercer" required>
            </div>

            <!-- Contact Grid -->
            <div class="input-row">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="alex@example.com" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="(555) 000-0000" required>
                </div>
            </div>

            <!-- Timing Grid -->
            <div class="input-row">
                <div class="input-group">
                    <label for="date">Which Day?</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="input-group">
                    <label for="time">What Time?</label>
                    <input type="time" id="time" name="time" required>
                </div>
            </div>

            <!-- Party Size -->
            <div class="input-group">
                <label for="guests">How many people?</label>
                <select id="guests" name="guests" required>
                    <option value="" disabled selected hidden>Choose party size...</option>
                    <option value="1">Just me (1)</option>
                    <option value="2">A duo (2)</option>
                    <option value="3">Small group (3)</option>
                    <option value="4">Classic table (4)</option>
                    <option value="5+">Large party (5+)</option>
                </select>
            </div>

            <!-- Custom Notes -->
            <div class="input-group">
                <label for="notes">Anything else we should know?</label>
                <textarea id="notes" name="notes" placeholder="Allergies, seating preferences, or celebrating something special?"></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="action-btn">Request Reservation</button>
        </form>
    </div>

</body>
</html>
